name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after publishing images
        type: boolean
        default: false

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Test and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint

  container-validation:
    name: Validate and build containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Lint GitHub Actions workflow
        run: docker run --rm --volume "$PWD:/repo:ro" --workdir /repo rhysd/actionlint:1.7.7 -color
      - name: Lint Dockerfiles
        run: >-
          docker run --rm --volume "$PWD:/repo:ro" hadolint/hadolint:v2.12.0-alpine
          hadolint /repo/backend/Dockerfile /repo/frontend/Dockerfile /repo/backup/Dockerfile
      - name: Lint shell scripts
        run: >-
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo
          koalaman/shellcheck-alpine:v0.10.0 shellcheck
          backend/docker-entrypoint.sh backup/backup.sh backup/backup-loop.sh backup/restore.sh
          ops/init-secrets.sh ops/smoke-test.sh ops/deploy.sh ops/verify-backup-restore.sh
      - name: Create ephemeral Compose secrets
        shell: bash
        run: |
          umask 077
          mkdir -p secrets
          openssl rand -base64 48 > secrets/postgres_password.txt
          openssl rand -base64 48 > secrets/backup_encryption_passphrase.txt
      - run: docker compose config --quiet
      - run: docker compose build backend frontend backup

  publish:
    name: Publish ${{ matrix.service }} image
    if: github.event_name != 'pull_request'
    needs: [quality, container-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
            image: starter-app-devops-backend
          - service: frontend
            context: ./frontend
            image: starter-app-devops-frontend
          - service: backup
            context: ./backup
            image: starter-app-devops-backup
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy production
    needs: publish
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: [self-hosted, linux, production]
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare runtime secrets
        shell: bash
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          test -n "$POSTGRES_PASSWORD"
          test -n "$BACKUP_PASSPHRASE"
          umask 077
          mkdir -p secrets backups monitoring/textfile
          printf '%s' "$POSTGRES_PASSWORD" > secrets/postgres_password.txt
          printf '%s' "$BACKUP_PASSPHRASE" > secrets/backup_encryption_passphrase.txt
      - name: Prepare deployment variables
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "BACKEND_IMAGE=ghcr.io/$owner/starter-app-devops-backend"
            echo "FRONTEND_IMAGE=ghcr.io/$owner/starter-app-devops-frontend"
            echo "BACKUP_IMAGE=ghcr.io/$owner/starter-app-devops-backup"
            echo "IMAGE_TAG=$GITHUB_SHA"
          } >> "$GITHUB_ENV"
      - name: Deploy, smoke test, and automatically roll back on failure
        shell: bash
        env:
          APP_BIND_ADDRESS: ${{ vars.APP_BIND_ADDRESS || '0.0.0.0' }}
          APP_HTTP_PORT: ${{ vars.APP_HTTP_PORT || '8080' }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN || '*' }}
          COMPOSE_PROFILES: ${{ vars.COMPOSE_PROFILES || 'monitoring,backup' }}
          PGDATABASE: ${{ vars.PGDATABASE || 'psu_activities' }}
          PGUSER: ${{ vars.PGUSER || 'app_user' }}
          PRE_DEPLOY_BACKUP: "true"
        run: sh ops/deploy.sh
