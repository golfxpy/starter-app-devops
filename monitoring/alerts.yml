groups:
  - name: starter-app-availability
    rules:
      - alert: MonitoringTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Monitoring target {{ $labels.instance }} is down"
          description: "Prometheus could not scrape {{ $labels.job }} for more than 2 minutes."

      - alert: ApplicationProbeFailed
        expr: probe_success{job="app-http"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Application probe failed for {{ $labels.instance }}"
          description: "The front-end or database-aware API health endpoint has failed for more than 2 minutes."

  - name: starter-app-backup
    rules:
      - alert: LastBackupFailed
        expr: starter_backup_last_run_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "The most recent PostgreSQL backup failed"

      - alert: BackupMissingOrStale
        expr: absent(starter_backup_last_success_timestamp_seconds) or (time() - starter_backup_last_success_timestamp_seconds > 93600)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "No successful PostgreSQL backup in the last 26 hours"
